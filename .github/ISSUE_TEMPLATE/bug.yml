name: Bug report
description: Something is broken or wrong
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time. The more exact, the faster it gets fixed.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: And what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce