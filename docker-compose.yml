services:
  db:
    image: postgres:17
    environment: { POSTGRES_USER: gramfeed, POSTGRES_PASSWORD: gramfeed }
    ports: ["5432:5432"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  minio:
    image: minio/minio
    command: server /data --console-address :9001
    ports: ["9000:9000", "9001:9001"]
